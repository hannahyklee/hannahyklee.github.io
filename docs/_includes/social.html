<ul class="social-media-list">
  {%- if site.github_username -%}
  <li><a href="https://github.com/{{ site.github_username }}"><svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#github"></use></svg> <span class="username">{{ site.github_username }}</span></a></li>
  {%- endif -%}
  {%- if site.linkedin_username -%}
  <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}"><svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#linkedin"></use></svg> <span class="username">{{ site.linkedin_username }}</span></a></li>
  {%- endif -%}
  {%- if site.orcid -%}
  <li><a href="https://orcid.org/{{ site.orcid }}" target="_blank" rel="me noopener noreferrer"><i class="ai ai-orcid" style="font-size:1.1em; vertical-align:middle;"></i> <span class="username">ORCID</span></a></li>
  {%- endif -%}
  {%- if site.google_scholar_id -%}
  <li><a href="https://scholar.google.com/citations?user={{ site.google_scholar_id }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-google-scholar" style="font-size:1.1em; vertical-align:middle;"></i> <span class="username">Google Scholar</span></a></li>
  {%- endif -%}
</ul>
