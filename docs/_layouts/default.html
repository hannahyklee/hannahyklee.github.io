<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}

          <!-- Popup Container -->
        <div id="imagePopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 1000;">
          <span onclick="closePopup()" style="position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; cursor: pointer;">&times;</span>
          <div id="popupContent" style="position: relative; display: flex; justify-content: center; align-items: center; max-width: 90vw; max-height: 90vh;">
            <!-- Image -->
            <img id="popupImage" style="max-width: 80vw; max-height: 80vh;">
          </div>
        </div>

        <script>
          function openPopup(imageSrc) {
            document.getElementById("popupImage").src = imageSrc;
            document.getElementById("imagePopup").style.display = "flex";
          }

          function closePopup() {
            document.getElementById("imagePopup").style.display = "none";
          }

          // Close only when clicking outside the popup content
          document.getElementById("imagePopup").addEventListener("click", function(event) {
            let popupContent = document.getElementById("popupContent");
            if (!popupContent.contains(event.target)) {
              closePopup();
            }
          });

          // Add event listener to all images to open popup on click
          document.querySelectorAll('img').forEach(function(img) {
            img.addEventListener('click', function() {
              openPopup(this.src);
            });
          });
        </script>

      </div>
    </main>

    {%- include footer.html -%}

  </body>
  
  {% include analytics.html %}
</html>
