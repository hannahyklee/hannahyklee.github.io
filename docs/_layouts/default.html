<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}

          <!-- Popup Container -->
        <div id="imagePopup">
          <span id="closeButton" onclick="closePopup()">&times;</span>
          <div id="popupContent">
            <!-- Image -->
            <img id="popupImage"> 
            <p id="popupCaption"></p>
          </div>
        </div>
      </div>

        <script>
          let isPopupOpen = false;
          function openPopup(imageSrc, captionText) {
            if (!isPopupOpen) {
              document.getElementById("popupImage").src = imageSrc;
              document.getElementById("imagePopup").style.display = "flex";
              document.getElementById("popupCaption").textContent = captionText;
              isPopupOpen = true;
            }
            
          }

          function closePopup() {
            document.getElementById("imagePopup").style.display = "none";
            isPopupOpen = false;
          }

          // Close only when clicking outside the popup content
          document.getElementById("imagePopup").addEventListener("click", function(event) {
            let popupContent = document.getElementById("popupContent");
            if (!popupContent.contains(event.target)) {
              closePopup();
            }
          });

          // Add event listener to all images to open popup on click
          document.querySelectorAll('img').forEach(function(img) {
            img.addEventListener('click', function() {
              var caption = img.getAttribute('data-caption') || img.alt;
              openPopup(this.src, caption);
            });
          });
        </script>

      </div>
    </main>

    {%- include footer.html -%}

  </body>
  
  {% include analytics.html %}
</html>
